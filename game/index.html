<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Wild Animals">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<title>Wild Animals Board Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<style>
/* VOICE: a family box game on the kitchen table: warm, bright, easy for a smart 3rd-4th grader on an iPad
   IDEA: the painted expedition map is the game board; the leather-and-brass frame of the painting is the table around it
   PICTURE: the board itself, as large as the screen allows, with pawns, glowing squares and the Field Check card dealt on top
   COLOUR and TYPE: deep leather brown, cream, brass; habitat shades only on squares, tokens and cards; Fredoka + Nunito Sans
   LAYOUT: slim top bar; board fills the middle; dock below with the players' token racks and a big die */
:root{color-scheme:dark;--bg:#211A11;--wood:#2E2416;--panel:#3A2E1D;--line:#5A4830;--cream:#F6E7C4;--ink:#FFF8EA;--muted:#CDBB97;--brass:#D8B064;--glow:#FFD24A}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Nunito Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6FB7FF;outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:12px;padding:6px max(2vw,10px);background:var(--wood);border-bottom:1px solid var(--line)}
.top h1{margin:0;font:600 19px/1.1 'Fredoka',sans-serif;color:var(--cream);flex:0 1 auto}
.top h1 span{color:var(--muted);font-weight:500}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--panel);font:600 17px 'Fredoka',sans-serif;color:var(--cream)}
.btn.main{background:var(--brass);border-color:var(--brass);color:#2B1D08;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:default}
.stage{position:relative;display:grid;place-items:center;padding:10px 6px 6px;overflow:hidden;overflow:clip}
#board{position:absolute;left:6px;top:10px;width:calc(100% - 12px);height:calc(100% - 16px);display:block;touch-action:manipulation;overflow:visible}
.banner{flex:2 1 auto;font-size:clamp(15px,1.7vw,19px)!important;background:rgba(33,26,17,.9);border:2px solid var(--brass);border-radius:999px;padding:7px 18px;font:600 clamp(16px,2vw,20px)/1.25 'Fredoka',sans-serif;color:var(--ink);text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.35);pointer-events:none;text-wrap:balance}
.banner b{color:var(--glow);font-weight:600}
.sq{transition:opacity .2s}
#board.choosing .sq.off{opacity:.32}
#board.choosing #trails{opacity:.3}
#trails{transition:opacity .25s}
.sq.go{transform:scale(1.18);transform-box:fill-box;transform-origin:center}
.sq{transition:opacity .25s,transform .2s}
.ring{fill:none;stroke:var(--glow);stroke-width:4.5;pointer-events:none}
.me{pointer-events:none}
@media(prefers-reduced-motion:no-preference){@keyframes pulse{from{stroke-opacity:1;stroke-width:7}to{stroke-opacity:.45;stroke-width:3}}.me{animation:pulse 1.1s ease-in-out infinite alternate}}
.hit{fill:transparent;cursor:default}
.hit.go{cursor:pointer}
.pawn{transition:transform .17s ease-in-out}
.dock{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:center;padding:8px max(2vw,10px) max(8px,env(safe-area-inset-bottom));background:var(--wood);border-top:1px solid var(--line)}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.pl{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--panel);border:2px solid transparent}
.pl.on{border-color:var(--glow);box-shadow:0 0 0 3px rgba(255,210,74,.18)}
.pl .pd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 15px 'Fredoka',sans-serif;border:2px solid rgba(0,0,0,.35);grid-row:span 2}
.pl .nm{font:600 17px/1.1 'Fredoka',sans-serif;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden}
.pl .nm small{font:700 13px 'Nunito Sans',sans-serif;color:var(--glow)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{width:17px;height:17px;border-radius:50%;border:2px dashed var(--c);opacity:.55}
.chip.got{background:var(--d);border:2px solid #fff;opacity:1}
.die{position:absolute;left:0;top:0;width:84px;height:84px;z-index:4;border-radius:22%;background:linear-gradient(145deg,#FFFFFF,#EFE6D2);border:0;box-shadow:inset 0 -7px 0 #D2C4A6,inset 0 3px 0 #fff,0 10px 18px rgba(0,0,0,.5);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12px;gap:2px;will-change:transform}
.die:disabled{cursor:default;pointer-events:none}
.dietip{position:absolute;left:0;top:0;z-index:4;transform:translate(-50%,0);background:rgba(33,26,17,.92);border:2px solid var(--glow);color:var(--ink);border-radius:999px;padding:3px 12px;font:600 15px 'Fredoka',sans-serif;white-space:nowrap;pointer-events:none;visibility:hidden}
.dietip.on{visibility:visible}
.die:not(:disabled){box-shadow:inset 0 -7px 0 #D2C4A6,inset 0 3px 0 #fff,0 0 0 5px var(--glow),0 0 24px rgba(255,210,74,.7),0 10px 18px rgba(0,0,0,.5)}
@media(prefers-reduced-motion:no-preference){.die:not(:disabled){animation:wob 1.6s ease-in-out infinite}@keyframes wob{0%,100%{transform:none}50%{transform:translateY(-6px) rotate(-4deg)}}}
.die i{width:68%;height:68%;border-radius:50%;background:#2B2418;place-self:center;visibility:hidden}
.die i.p{visibility:visible}
.veil{position:fixed;inset:0;background:rgba(15,11,6,.72);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(3vh,12px) 12px 24px;z-index:10}
.veil.open{display:flex}
.sheet{width:min(760px,100%);margin:auto 0}
.foot{margin-top:14px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.foot .msg{flex:1 1 260px;font:600 19px/1.3 'Fredoka',sans-serif}
.foot .msg small{display:block;font:600 15px 'Nunito Sans',sans-serif;color:var(--muted);margin-top:2px}
.bigchip{width:46px;height:46px;border-radius:50%;border:3px solid #fff;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.35)}
@media(prefers-reduced-motion:no-preference){.bigchip{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}}
.box{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,30px)}
.box h2{margin:0 0 6px;font:700 clamp(26px,3.4vw,34px)/1.1 'Fredoka',sans-serif;color:var(--cream);text-wrap:balance}
.box p{margin:6px 0;color:var(--muted)}
.box ol{margin:8px 0;padding-left:22px}.box li{margin:6px 0}
.habs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.hab{min-height:64px;border-radius:14px;border:0;background:var(--d);color:#fff;font:600 17px/1.2 'Fredoka',sans-serif;padding:8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.hab:disabled{opacity:.4}
.seat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;margin:10px 0 14px}
.seat input[type=text]{width:100%;min-height:46px;border-radius:12px;border:2px solid var(--line);background:#2A2115;color:var(--ink);font:700 17px 'Nunito Sans',sans-serif;padding:0 12px}
.seat input[type=text]:disabled{opacity:.4}
.sw{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px}.sw.off{opacity:.35}
.swb{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid rgba(0,0,0,.35);padding:0}
.swb[aria-checked=true]{border-color:var(--glow);box-shadow:0 0 0 3px var(--glow)}
.swb.taken{opacity:.25}
.anb{width:44px;height:44px;border-radius:12px;background:#FBF7EE;border:3px solid transparent;padding:3px;display:grid;place-items:center}
.anb[aria-checked=true]{border-color:var(--glow);box-shadow:0 0 0 3px var(--glow)}
.anb.taken{opacity:.25}.anb:disabled{cursor:default}
.pl .pd svg{display:block}
.anm{flex-basis:100%;font-weight:800;color:var(--cream);font-size:15px}
.swb:disabled{cursor:default}
.tog{display:flex;align-items:center;gap:10px;min-height:46px;cursor:pointer;font-weight:700}
.tog input{width:24px;height:24px;accent-color:var(--brass)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.setup{width:min(640px,100%)}
.setup h2 span{display:block;font:500 18px 'Fredoka',sans-serif;color:var(--muted);margin-top:4px}
.win{text-align:center}
.win .trophy{width:120px;height:120px;margin:4px auto 8px}
@media(max-width:1240px){.top h1 span{display:none}}
@media(max-width:820px){.top{flex-wrap:wrap}.top h1{flex:1}.banner{order:3;flex-basis:100%}.dock{grid-template-columns:minmax(0,1fr)}.players{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.top h1 span{display:none}.habs{grid-template-columns:repeat(2,minmax(0,1fr))}.pl{grid-template-columns:24px minmax(0,1fr);padding:6px 8px}.pl .pd{width:24px;height:24px;font-size:13px}.chip{width:13px;height:13px}.die{width:68px;height:68px;padding:9px}.die i{width:11px;height:11px}}

.ring.own{stroke:#fff;stroke-dasharray:8 6}
.banner .ck svg{vertical-align:-5px}
.veil.open{animation:vin .2s ease-out}@keyframes vin{from{opacity:0}to{opacity:1}}
.deal{position:relative}
.back{position:absolute;inset:0;z-index:3;border-radius:24px;border:12px solid var(--k);background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.22),transparent 55%),repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 14px,transparent 14px 28px),var(--d);box-shadow:0 16px 30px rgba(0,0,0,.35);display:grid;place-items:center}
.bf{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-align:center;background:rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.7);border-radius:20px;padding:18px 30px}
.bl{font:700 clamp(30px,4vw,42px)/1 'Fredoka',sans-serif;letter-spacing:.5px}
.bh{font:600 20px 'Fredoka',sans-serif}.bt{font:700 15px 'Nunito Sans',sans-serif;opacity:.9}
.fc-card.fc-good{box-shadow:0 0 0 6px #3DDC84,0 0 40px rgba(61,220,132,.65)}
.fc-card.fc-bad{box-shadow:0 0 0 6px #FF6B5E,0 0 40px rgba(255,107,94,.6)}
.stamp{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.stamp svg{width:clamp(110px,18vw,150px);height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.stamp b{font:700 clamp(34px,5vw,48px)/1 'Fredoka',sans-serif;color:#fff;padding:6px 22px;border-radius:999px;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.stamp.good b{background:#1E8E4E}.stamp.bad b{background:#C2362F}
.cf{position:absolute;left:50%;top:42%;width:12px;height:16px;border-radius:3px;z-index:5;pointer-events:none}
.cbtn{display:inline-flex;align-items:center;gap:8px;border-color:#C9A25A}.cbtn svg{flex:none}.cbtn small{color:var(--muted);font:600 14px 'Nunito Sans',sans-serif}
.bigc{flex:none;display:grid;place-items:center}@media(prefers-reduced-motion:no-preference){.bigc{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}}
.cmps{display:inline-flex;gap:2px;margin-left:6px;vertical-align:-3px}
.foot.good{background:#1F5F35;border-color:#3DDC84}.foot.bad{background:#6E211B;border-color:#FF7A6B}
.foot.good .msg small,.foot.bad .msg small{color:#F3EBDA}
.welcome{text-align:center;width:min(720px,100%)}
.pins{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-bottom:6px}
@media(prefers-reduced-motion:no-preference){.dp{display:inline-block;animation:hop 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}@keyframes hop{0%,70%,100%{transform:none}80%{transform:translateY(-10px)}}}
.wt{font-size:clamp(32px,5vw,48px)!important}.wt span{display:block;font:500 22px 'Fredoka',sans-serif;color:var(--brass);margin-top:6px}
.welcome p{max-width:52ch;margin:10px auto!important;font-size:17px}
.row.center{justify-content:center}.btn.big{min-height:56px;padding:0 26px;font-size:20px}
a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.cnt{min-height:120px;border-radius:20px;border:3px solid var(--line);background:#2A2115;color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cnt b{font:700 52px/1 'Fredoka',sans-serif}.cnt span{font:600 17px 'Fredoka',sans-serif;color:var(--muted)}
.cnt:hover{border-color:var(--brass)}
.step{margin:0 0 6px!important;font:600 16px 'Fredoka',sans-serif;color:var(--brass)!important}
.who{display:flex;gap:18px;align-items:center}
.prev{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:120px}.prev span{font-weight:800;font-size:14px;color:var(--cream);text-align:center}
.nmw{flex:1;display:flex;flex-direction:column;gap:6px;font:600 17px 'Fredoka',sans-serif;color:var(--cream)}
.nmw input{min-height:52px;border-radius:12px;border:2px solid var(--line);background:#2A2115;color:var(--ink);font:700 20px 'Nunito Sans',sans-serif;padding:0 14px;user-select:text;-webkit-user-select:text}
.setup h3{margin:16px 0 8px;font:600 19px 'Fredoka',sans-serif;color:var(--cream)}
.anims{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.anc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;background:#FBF7EE;color:#2B2418;border:3px solid transparent;min-height:88px}
.anc span{font:700 12.5px/1.15 'Nunito Sans',sans-serif;text-align:center}
.anc[aria-pressed=true]{border-color:var(--glow);box-shadow:0 0 0 3px var(--glow)}
.anc:disabled{opacity:.3;cursor:default}.anc em{position:absolute;top:4px;right:6px;font:700 11px 'Nunito Sans',sans-serif;font-style:normal;color:#7F1D1D}
.swb[aria-pressed=true]{border-color:var(--glow);box-shadow:0 0 0 3px var(--glow)}
@media(max-width:600px){.counts{grid-template-columns:repeat(2,minmax(0,1fr))}.who{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Wild Animals of the World <span>· The Board Game</span></h1>
    <div class="banner" id="banner" aria-live="polite">Loading the game…</div>
    <button class="btn" id="rulesBtn" type="button">Rules</button>
    <button class="btn" id="menuBtn" type="button">Menu</button>
  </header>
  <main class="stage" id="stage">
    <button class="die" id="die" type="button" aria-label="Roll the die" disabled></button>
    <span class="dietip" id="dietip">Tap to roll</span>
    <svg id="board" viewBox="0 0 1585 992" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Game board: a painted map of nine habitats with trails, colored squares and Base Camp in the middle">
      <defs><radialGradient id="bgg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#5B4A2C"/><stop offset="1" stop-color="#2B2418"/></radialGradient></defs>
      <rect width="1585" height="992" rx="14" fill="url(#bgg)"/>
      <image href="board.jpg" x="0" y="0" width="1585" height="992" preserveAspectRatio="none"/>
      <rect width="1585" height="992" fill="#1E170C" opacity=".18" pointer-events="none"/>
      <g id="trails"></g><g id="lit"></g><g id="squares"></g><g id="hub"></g>

/* ---------- board drawing ---------- */
/* organic trails: each trail is a gentle curve that flows through the squares (shared by game and editor) */
function trailPath(sub,E,pos,ring){
  const adj={};E.forEach(([a,b])=>{(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a)});
  const nrm=v=>{const L=Math.hypot(v[0],v[1])||1;return[v[0]/L,v[1]/L]},to=(p,q)=>nrm([q[0]-p[0],q[1]-p[1]]);
  const end=(i,o)=>{const p=pos(i);if(i!==0)return p;const d=to(p,pos(o));return[p[0]+d[0]*ring,p[1]+d[1]*ring]};
  const tan=(i,o)=>{const dir=to(pos(i),pos(o));if(i===0||adj[i].length!==2)return dir;
    const other=adj[i][0]===o?adj[i][1]:adj[i][0],t=to(pos(other),pos(o));return nrm([t[0]+dir[0]*.35,t[1]+dir[1]*.35])};
  const f=n=>n.toFixed(1);
  return sub.map(([u,v])=>{const a=end(u,v),b=end(v,u),L=Math.hypot(b[0]-a[0],b[1]-a[1]),k=L*.36,tu=tan(u,v),tv=tan(v,u),
    s=((u*7+v*13)%5-2)*.04*L,n=[-(b[1]-a[1])/L,(b[0]-a[0])/L];
    return`M${f(a[0])} ${f(a[1])} C${f(a[0]+tu[0]*k+n[0]*s)} ${f(a[1]+tu[1]*k+n[1]*s)} ${f(b[0]+tv[0]*k+n[0]*s)} ${f(b[1]+tv[1]*k+n[1]*s)} ${f(b[0])} ${f(b[1])}`}).join(' ');
}

function edgePt(i,o){
  if(i!==HUB)return[N[i].x,N[i].y];
  const h=N[HUB],dx=N[o].x-h.x,dy=N[o].y-h.y,L=Math.hypot(dx,dy)||1;
  return[h.x+dx/L*BOARD.ring,h.y+dy/L*BOARD.ring];
}
function drawBoard(){

  $('squares').innerHTML=N.slice(1).map(n=>`<g class="sq" data-n="${n.id}"><rect x="${n.x-17}" y="${n.y-15}" width="38" height="38" rx="10" fill="#120D06" fill-opacity=".5"/><rect x="${n.x-22}" y="${n.y-22}" width="44" height="44" rx="13" fill="#1E170C" fill-opacity=".85"/><rect x="${n.x-19}" y="${n.y-19}" width="38" height="38" rx="10" fill="${HC(n.zone)}" stroke="#fff" stroke-width="3.5"/><rect x="${n.x-14}" y="${n.y-15}" width="28" height="10" rx="5" fill="#fff" fill-opacity=".22"/></g>`).join('');
  const h=N[HUB],x=h.x,y=h.y;
  $('hub').innerHTML=`<circle cx="${x}" cy="${y+4}" r="63" fill="#1E170C" fill-opacity=".45"/><image href="basecamp.png" x="${x-64}" y="${y-64}" width="128" height="128"/><title>Base Camp: start and win here</title>`;
  $('hits').innerHTML=N.map(n=>`<circle class="hit" data-n="${n.id}" cx="${n.x}" cy="${n.y}" r="${n.id===HUB?60:30}"><title>${n.id===HUB?'Base Camp':esc(bname(n.zone))}</title></circle>`).join('');
}
const SLOT=[[-15,2],[15,2],[-8,14],[8,14]],HSLOT=[[-80,40],[80,40],[-80,0],[80,0]];
const tint=(h,f)=>{const n=parseInt(h.slice(1),16),m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return'#'+[n>>16,n>>8&255,n&255].map(v=>m(v).toString(16).padStart(2,'0')).join('')};
function pawnXY(pi,node){
  const n=N[node];
  if(node===HUB){const o=HSLOT[S.players[pi].seat];return[n.x+o[0],n.y+o[1]]}
  const here=S.players.filter(p=>p.pos===node);
  if(here.length<2)return[n.x,n.y+6];

/* Game piece: a map pin. The head carries a 9-wedge token ring (one wedge per habitat, filled when earned) and a crown with all 9. Tip at 0,0. */
function wedge(k,r0,r1){
  const g=2.4,a0=(-90+k*40+g)*Math.PI/180,a1=(-90+(k+1)*40-g)*Math.PI/180,P=(r,a)=>`${(r*Math.cos(a)).toFixed(2)} ${(-54+r*Math.sin(a)).toFixed(2)}`;
  return `M${P(r1,a0)} A${r1} ${r1} 0 0 1 ${P(r1,a1)} L${P(r0,a1)} A${r0} ${r0} 0 0 0 ${P(r0,a0)} Z`;
}
const pinPath=(R,t)=>`M0 ${-t} C-6 -14 ${-R} -30 ${-R} -54 A${R} ${R} 0 1 1 ${R} -54 C${R} -30 6 -14 0 ${-t} Z`;
function pinG(p,gid,active){

  const crown=has9(p)?`<path d="M-18 -84 L-20 -101 L-10 -93 L0 -106 L10 -93 L20 -101 L18 -84 Z" fill="#FFD24A" stroke="#1E170C" stroke-width="3" stroke-linejoin="round"/><circle cx="0" cy="-106" r="3" fill="#fff"/>`:'';
  return `<defs><linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="#0B0B0C"/><stop offset=".35" stop-color="#4A4A4E"/><stop offset="1" stop-color="#050506"/></linearGradient></defs>`+
    `<ellipse cx="0" cy="1" rx="11" ry="4" fill="#000" opacity=".5"/>${active?'<circle class="me" cy="-54" r="39" fill="none" stroke="#FFD24A" stroke-width="5"/>':''}`+
    `<path d="${pinPath(33,0)}" fill="#1E170C"/><path d="${pinPath(30,4)}" fill="url(#${gid})"/><circle cy="-54" r="31" fill="#1E170C"/>${ring}`+
    `<circle cy="-54" r="19.5" fill="#fff"/><circle cy="-54" r="17.5" fill="${c}"/><g transform="translate(0 -54)">${animalG(pa(p),P.t,c,27)}</g>${crown}`;
}
const pinSvg=(p,gid,w)=>`<svg viewBox="-42 -112 84 118" width="${w}" height="${Math.round(w*118/84)}" aria-hidden="true">${pinG(p,gid,false)}</svg>`;
function drawPawns(){
  $('pawns').innerHTML=S.players.map((p,i)=>`<g class="pawn" id="pawn${i}"><title>${esc(p.name)}: ${esc(pa(p).name)}, ${p.tokens.length} of 9 tokens</title><g transform="scale(.95)">${pinG(p,'pg'+i,i===S.turn&&!S.winner)}</g></g>`).join('');

function placePawns(){S.players.forEach((p,i)=>{const[x,y]=pawnXY(i,p.pos);$('pawn'+i).setAttribute('transform',`translate(${x} ${y})`)})}
function trailD(edges){return trailPath(edges,BOARD.edges,i=>[N[i].x,N[i].y],BOARD.ring)}
function showDests(){

  $('lit').innerHTML=d?`<path d="${d}" stroke="#1E170C" stroke-opacity=".6" stroke-width="13" stroke-linecap="round" fill="none"/><path d="${d}" stroke="#fff" stroke-width="6.5" stroke-linecap="round" fill="none"/>`:'';
  const p=S&&S.players.length?cur():null,own=k=>p&&k!==HUB&&p.tokens.includes(N[k].zone);
  $('rings').innerHTML=[...dests.keys()].map(k=>k===HUB?`<circle class="ring" cx="${N[k].x}" cy="${N[k].y}" r="67"/>`:`<rect class="ring${own(k)?' own':''}" x="${N[k].x-30}" y="${N[k].y-30}" width="60" height="60" rx="17"/>`).join('')+
    [...dests.keys()].filter(own).map(k=>`<g transform="translate(${N[k].x+24} ${N[k].y-24})"><title>You already have the ${esc(bname(N[k].zone))} token</title><circle r="13" fill="#1E8E4E" stroke="#fff" stroke-width="3"/><path d="M-6 0 L-1.5 5 L6.5 -5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>`).join('');

/* ---------- moves: exactly the roll, no turning back; with all 9 tokens, Base Camp on any roll that reaches it ---------- */
function reach(from,n,all9){
  const out=new Map(),lit={nodes:new Set([from]),edges:new Set()};out.lit=lit;
  const light=path=>path.forEach((v,k)=>{lit.nodes.add(v);if(k){const u=path[k-1];lit.edges.add(u<v?u+'-'+v:v+'-'+u)}});
  (function walk(node,path){
    if(path.length-1===n){if(node!==HUB){if(!out.has(node))out.set(node,path.slice());light(path)}return}
    for(const m of adj[node]){
      if(path.includes(m))continue;
      if(m===HUB&&all9){if(!out.has(HUB))out.set(HUB,[...path,HUB]);light([...path,HUB]);continue}
      path.push(m);walk(m,path);path.pop();
    }
  })(from,[from]);
  return out;
}

/* ---------- dock ---------- */
function drawDock(){
  $('players').innerHTML=S.players.map((p,i)=>{const P=pc(p);return`<div class="pl${i===S.turn&&!S.winner?' on':''}"><span class="pd" style="background:${P.c}" title="${esc(pa(p).name)}">${pieceHtml(p,24)}</span><span class="nm"><span>${esc(p.name)}${cmp(p)?`<span class="cmps" title="${cmp(p)} compass${cmp(p)>1?'es':''}">${COMPASS(24).repeat(cmp(p))}</span>`:''}</span>${i===S.turn&&!S.winner?'<small>Turn</small>':''}</span><span class="chips">${BI.map(b=>`<i class="chip${p.tokens.includes(b)?' got':''}" style="--c:${SH[b][1]};--d:${SH[b][0]}" title="${esc(bname(b))}${p.tokens.includes(b)?' token':''}"></i>`).join('')}</span></div>`}).join('');
  const canRoll=S.phase==='roll'&&!busy;
  $('die').disabled=!canRoll;
  $('dietip').classList.toggle('on',canRoll);
}
/* The die lives on the board, resting on the painted journal (bottom right, no squares there). */
const REST_AT=[1440,872];let GEO=null;
function geo(){
  const st=$('stage').getBoundingClientRect(),r=$('board').getBoundingClientRect(),k=Math.min(r.width/1585,r.height/992);
  return{k,ox:r.left-st.left+(r.width-1585*k)/2,oy:r.top-st.top+(r.height-992*k)/2};
}
function placeDie(){
  GEO=geo();const{k,ox,oy}=GEO,ds=Math.round(Math.max(52,Math.min(104,128*k))),d=$('die');
  GEO.ds=ds;GEO.x=ox+REST_AT[0]*k-ds/2;GEO.y=oy+REST_AT[1]*k-ds/2;
  d.style.width=d.style.height=ds+'px';d.style.padding=Math.round(ds*.14)+'px';d.style.borderRadius=Math.round(ds*.22)+'px';d.style.left=GEO.x+'px';d.style.top=GEO.y+'px';
  const t=$('dietip');t.style.left=(GEO.x+ds/2)+'px';t.style.top=(GEO.y-34)+'px';
}
async function throwDie(v){
  const d=$('die');if(!d.animate||!GEO)return;
  const{k,ox,oy,ds}=GEO,X=560+Math.random()*560,Y=330+Math.random()*360;
  const dx=ox+X*k-ds/2-GEO.x,dy=oy+Y*k-ds/2-GEO.y,turn=(Math.random()<.5?-1:1),R=a=>`rotate(${turn*a}deg)`;
  $('dietip').classList.remove('on');d.style.animation='none';
  let spinning=true;(async()=>{while(spinning){face(1+Math.floor(Math.random()*6));await sleep(75)}})();
  await d.animate([
    {transform:`translate(0,0) ${R(0)} scale(1)`},
    {transform:`translate(${dx*.3}px,${dy*.3-150*k}px) ${R(260)} scale(1.45)`,offset:.3},
    {transform:`translate(${dx*.72}px,${dy*.72}px) ${R(520)} scale(1.1)`,offset:.62},
    {transform:`translate(${dx*.88}px,${dy*.88-40*k}px) ${R(640)} scale(1.18)`,offset:.8},
    {transform:`translate(${dx}px,${dy}px) ${R(712)} scale(1.1)`}
  ],{duration:1000,easing:'cubic-bezier(.3,.6,.4,1)',fill:'forwards'}).finished.catch(()=>{});

  await d.animate([{transform:`translate(${dx}px,${dy}px) ${R(712)} scale(1.1)`},{transform:`translate(${dx}px,${dy}px) rotate(${turn*720}deg) scale(1.5)`,offset:.4},{transform:`translate(${dx}px,${dy}px) rotate(${turn*720}deg) scale(1.3)`}],{duration:420,easing:'ease-out',fill:'forwards'}).finished.catch(()=>{});
  await sleep(650);
  await d.animate([{transform:`translate(${dx}px,${dy}px) scale(1.3)`},{transform:'translate(0,0) scale(1)'}],{duration:420,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished.catch(()=>{});

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function face(v){$('die').innerHTML=Array.from({length:9},(_,k)=>`<i class="${PIPS[v||5].includes(k)?'p':''}"></i>`).join('');$('die').setAttribute('aria-label',v?`Die shows ${v}. ${S.phase==='roll'?'Tap to roll':''}`:'Roll the die')}
function banner(html){$('banner').innerHTML=html}

/* ---------- save ---------- */
function save(){S.deck=deck.save();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSaved(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&s.players&&!s.winner?s:null}catch(e){return null}}

/* ---------- turn flow ---------- */
function render(){drawPawns();drawDock();face(S.roll);showDests()}
function startTurn(){
  S.phase='roll';S.roll=null;S.second=false;S.card=null;dests=new Map();save();render();
  const p=cur();
  banner(has9(p)?`<b>${esc(p.name)}</b> has all 9 tokens! Roll and head for Base Camp`:`<b>${esc(p.name)}</b>'s turn: tap the die to roll`);
}
async function roll(){
  if(S.phase!=='roll'||busy)return;
  busy=true;drawDock();
  const v=1+Math.floor(Math.random()*6);
  if(!calm)await throwDie(v);
  S.roll=v;face(v);busy=false;
  const p=cur();dests=reach(p.pos,v,has9(p));
  if(!dests.size){S.phase='stuck';drawDock();banner(`<b>${esc(p.name)}</b> rolled ${v}, but there is nowhere to go. Turn passes.`);await sleep(1600);return next()}
  S.phase='choose';save();drawDock();showDests();
  banner(`<b>${esc(p.name)}</b> rolled <b>${v}</b>: tap a glowing ${dests.has(HUB)?'square or Base Camp':'square'}`+([...dests.keys()].some(k=>k!==HUB&&p.tokens.includes(N[k].zone))?` · <span class="ck">${CHECK}</span> = got it`:''));
}
async function moveTo(dest){
  if(S.phase!=='choose'||!dests.has(dest)||busy)return;
  const path=dests.get(dest);busy=true;S.phase='moving';dests=new Map();showDests();drawDock();
  const p=cur(),i=S.turn;
  for(const node of path.slice(1)){p.pos=node;const[x,y]=pawnXY(i,node);$('pawn'+i).setAttribute('transform',`translate(${x} ${y})`);await sleep(calm?40:190)}
  placePawns();busy=false;
  if(dest===HUB)return pickFinal();
  S.phase='question';S.card=drawFor(N[dest].zone).id;save();ask();
}
/* Squares no longer show a question type: every square draws a random question from its habitat. */
function drawFor(b){let c=deck.drawAny(b);if(!c){deck.reset(b);c=deck.drawAny(b)}return c}
const cardById=id=>D.cards.find(c=>c.id===id);

function openVeil(html){$('sheet').innerHTML=html;$('veil').classList.add('open');$('veil').scrollTop=0}

  F.render($('cardEl'),card,D,{final,deal:false,onResult:ok=>result(card,ok)});

    $('useC').onclick=()=>{p.compass=cmp(p)-1;let c=null;for(let t=0;t<6&&(!c||c.id===card.id);t++)c=drawFor(b);S.card=c.id;save();drawDock();ask()};

    await sleep(260);
    await bk.animate([{transform:'perspective(1400px) rotateY(0)'},{transform:'perspective(1400px) rotateY(90deg)'}],{duration:180,easing:'ease-in'}).finished;

}
/* Right/wrong: big stamp, card glow, shake on wrong, confetti on right, sound */
let AC=null,SOUND=true;try{SOUND=localStorage.getItem('wa-sound')!=='off'}catch(e){}
function tone(ok){

    (ok?[[523,0],[659,.1],[784,.2],[1047,.3]]:[[196,0],[147,.22]]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(ok?.25:.07,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+(ok?.3:.4));o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.45)});
  }catch(e){}
}
function confetti(host,n,cols){

  for(let k=0;k<n;k++){
    const el=document.createElement('i');el.className='cf';el.style.background=cols[k%cols.length];host.appendChild(el);
    const ang=Math.random()*Math.PI*2,dist=120+Math.random()*260,dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist*.7-80,rot=Math.random()*720-360;
    el.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:1},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${rot/2}deg)`,opacity:1,offset:.55},{transform:`translate(calc(-50% + ${dx*1.1}px),calc(-50% + ${dy+220}px)) rotate(${rot}deg)`,opacity:0}],{duration:1300+Math.random()*500,easing:'cubic-bezier(.15,.7,.4,1)'}).onfinish=()=>el.remove();
  }
}
function feedback(ok,b,big){

  tone(ok);
  const st=document.createElement('div');st.className='stamp '+(ok?'good':'bad');st.setAttribute('aria-hidden','true');
  st.innerHTML=(ok?'<svg viewBox="-50 -50 100 100"><circle r="46" fill="#1E8E4E" stroke="#fff" stroke-width="7"/><path d="M-22 1 L-6 18 L25 -18" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Correct!</b>':'<svg viewBox="-50 -50 100 100"><circle r="46" fill="#C2362F" stroke="#fff" stroke-width="7"/><path d="M-18 -18 L18 18 M18 -18 L-18 18" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg><b>Not quite!</b>');
  deal.appendChild(st);
  if(calm||!st.animate){setTimeout(()=>st.remove(),1400);return}
  st.animate([{transform:'translate(-50%,-50%) scale(2.4)',opacity:0},{transform:'translate(-50%,-50%) scale(.92)',opacity:1,offset:.22},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.3},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.8},{transform:'translate(-50%,-50%) scale(.85)',opacity:0}],{duration:1700,easing:'ease-out'}).onfinish=()=>st.remove();
  if(ok)confetti(deal,big?90:40,[SH[b][0],SH[b][1],SH[b][2],'#FFD24A','#FFFFFF']);
  else if(fc)fc.animate([{transform:'translateX(0)'},{transform:'translateX(-16px) rotate(-1deg)'},{transform:'translateX(14px) rotate(1deg)'},{transform:'translateX(-10px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:480,delay:150,easing:'ease-out'});
}

function result(card,ok){
  deck.answer(card,ok);
  const p=cur(),b=card.biome,foot=$('foot');
  feedback(ok,b,S.phase==='final'&&ok);foot.classList.add(ok?'good':'bad');
  if(S.phase==='final'){
    if(ok){S.winner=S.turn;S.phase='won';save();foot.innerHTML=`<div class="msg">Correct! ${esc(p.name)} wins!</div><button class="btn main" id="go" type="button">See the winner</button>`;$('go').onclick=win;return}
    S.phase='after';save();
    foot.innerHTML=`<div class="msg">So close!<small>${esc(p.name)} keeps all 9 tokens. Head out on your next turn and come back to Base Camp to try again.</small></div><button class="btn main" id="go" type="button">Next player</button>`;
    $('go').onclick=()=>{closeVeil();next()};return;
  }
  S.phase='after';
  let msg,btns='',firstC=false;
  if(ok&&!p.tokens.includes(b)){
    p.tokens.push(b);
    msg=`<span class="bigchip" style="background:${SH[b][0]}"></span><div class="msg">${esc(p.name)} earned the ${esc(bname(b))} token!<small>${has9(p)?'That makes all 9! Now get back to Base Camp to win.':`${p.tokens.length} of 9 tokens.`}</small></div>`;
  }else if(ok){
    const got=cmp(p)<MAXC;if(got)p.compass=cmp(p)+1;
    if(got&&!S.compassTip){S.compassTip=true;firstC=true}
    msg=`${got?`<span class="bigc">${COMPASS(64)}</span>`:''}<div class="msg">${got?`${esc(p.name)} earned a compass!`:'Correct!'}<small>${got?`You already have the ${esc(bname(b))} token, so you get a compass instead (${cmp(p)} of ${MAXC}). Use it to skip a question on a square whose token you still need.`:`Your compass bag is full (${MAXC} of ${MAXC}). Use one to skip a question you don't know.`}</small></div>`;
  }else{
    msg=`<div class="msg">Not this time!<small>No token this time. ${esc(p.name)} stays on this square.</small></div>`;
  }
  save();drawDock();
  foot.innerHTML=msg+btns+`<button class="btn main" id="go" type="button">${S.players.length>1?'Next player':'Keep going'}</button>`;
  if(!ok)$('go').textContent='End turn';
  $('go').onclick=()=>{
    if(firstC){compassTip();return}
    closeVeil();next()};
}
/* First compass of the game: a one-time reminder of what it does */
function compassTip(){
  openVeil(`<div class="box" style="text-align:center"><div style="width:72px;height:72px;margin:0 auto 6px">${COMPASS(72).replace('style="','style="width:72px;height:72px;')}</div><h2>Your first compass!</h2>
  <ul style="text-align:left;line-height:1.45;margin:8px 0 14px;padding-left:20px">
  <li><b>How you earn one:</b> answer right on a habitat whose token you already have.</li>
  <li><b>What it does:</b> on a square whose token you still need, tap <b>Use a compass</b> on the question to skip it and get a new one.</li>
  <li>You can hold up to <b>3</b>. Your compasses show next to your name in the player list.</li></ul>
  <div class="row" style="justify-content:center"><button class="btn main" id="tipOk" type="button">Got it</button></div></div>`);
  $('tipOk').onclick=()=>{closeVeil();next()};
}
function next(){S.turn=(S.turn+1)%S.players.length;startTurn()}

/* ---------- final question at Base Camp ---------- */
function pickFinal(){
  const p=cur(),others=S.players.length>1;
  S.phase='pick';save();render();
  banner(`<b>${esc(p.name)}</b> made it back to Base Camp!`);
  openVeil(`<div class="box"><h2>${others?`Everyone else: pick ${esc(p.name)}'s final habitat`:'Pick your final habitat'}</h2><p>${others?`Choose together. ${esc(p.name)} gets one question from that habitat's deck. Right answer wins the game.`:'You get one question from that habitat. Right answer wins.'}</p><div class="habs">${BI.map(b=>`<button class="hab" type="button" data-b="${b}" style="--d:${SH[b][0]}">${esc(bname(b))}</button>`).join('')}</div></div>`);
  $('sheet').querySelectorAll('.hab').forEach(el=>el.onclick=()=>{
    const b=el.dataset.b;let c=deck.drawAny(b);if(!c){deck.reset(b);c=deck.drawAny(b)}
    S.phase='final';S.finalBiome=b;S.card=c.id;save();ask();
  });
}
function win(){
  const p=S.players[S.winner],P=pc(p);drawDock();
  banner(`<b>${esc(p.name)}</b> wins the expedition!`);
  try{localStorage.removeItem(KEY)}catch(e){}
  openVeil(`<div class="box win"><svg class="trophy" viewBox="0 0 120 120" aria-hidden="true"><path d="M34 18h52v22c0 20-12 34-26 34S34 60 34 40z" fill="#D8B064"/><path d="M34 26H16c0 18 8 26 20 28M86 26h18c0 18-8 26-20 28" fill="none" stroke="#D8B064" stroke-width="7"/><rect x="52" y="72" width="16" height="18" fill="#B88E43"/><rect x="36" y="90" width="48" height="14" rx="4" fill="#8A6A2E"/><circle cx="60" cy="40" r="17" fill="${P.c}" stroke="#2B2418" stroke-width="3"/><g transform="translate(60 40)">${animalG(pa(p),P.t,P.c,26)}</g></svg><h2>${esc(p.name)} wins!</h2><p>All 9 habitat tokens and the final question, answered right. What an expedition.</p><div class="row" style="justify-content:center"><button class="btn main" id="again" type="button">Play again</button></div></div>`);
  $('again').onclick=welcome;
}

/* ---------- setup, rules, menu ---------- */
const RULES=`<ol><li>Everyone starts at <b>Base Camp</b>. On your turn, tap the die and move exactly that many steps along the trails, without turning back. Tap one of the glowing squares.</li><li>A green <b>check mark</b> on a glowing square means you already have that habitat's token, so pick another square if you can.</li><li>Each habitat has its own color. Land on a square and you get a surprise question from that habitat: multiple choice, true or false, fill in the blank, or a <b>Guess this animal</b> photo.</li><li>Answer right to earn that habitat's token. Its wedge lights up in the ring around your piece.</li><li><b>Earning a compass:</b> answer right on a habitat whose token you <b>already have</b> and you earn a <b>compass</b> instead. You can hold up to 3.</li><li><b>Using a compass:</b> on a square whose token you still need, tap <b>Use a compass</b> to skip a question you don't know and get a new one. The skipped card goes back in the deck.</li><li>Answer wrong and your turn ends. No token, and you stay put.</li><li>Fill all <b>9 wedges</b> and your piece gets a crown. Then get back to Base Camp; any roll that reaches it counts.</li><li>The other players pick a habitat for your <b>final question</b>. Get it right and you win!</li></ol>`;
let LAST=[];
function setup(){welcome()}
function welcome(){
  const saved=loadSaved();
  if(S&&S.players&&S.players.length)LAST=S.players.map(p=>({name:p.name,animal:p.animal,color:p.color}));
  dests=new Map();S={players:[],turn:0,phase:'setup'};$('pawns').innerHTML='';$('rings').innerHTML='';$('players').innerHTML='';$('die').disabled=true;$('dietip').classList.remove('on');face(null);
  banner('Welcome, explorers!');
  const demo=ANIMALS.map((a,k)=>`<span class="dp" style="--i:${k}">${pinSvg({animal:k,color:[0,1,2,5,4,3,6,7,8][k],tokens:BI.slice(0,k+1)},'wp'+k,46)}</span>`).join('');
  openVeil(`<div class="box welcome"><div class="pins">${demo}</div><h2 class="wt">Wild Animals of the World<span>The Board Game</span></h2><p>Explore nine habitats, answer Field Check questions, and fill your piece's ring with all <b>9 habitat tokens</b>. Then race back to Base Camp and answer the final question to win!</p><div class="row center"><button class="btn main big" id="wNew" type="button">New game</button>${saved?'<button class="btn big" id="wRes" type="button">Continue saved game</button>':''}<button class="btn big" id="wHow" type="button">How to play</button></div><div class="row center"><a class="btn big" id="wBook" href="../Contents.html">&#8592; Back to the book</a></div></div>`);
  $('wNew').onclick=countScreen;
  $('wHow').onclick=()=>{openVeil(`<div class="box"><h2>How to play</h2>${RULES}<div class="row"><button class="btn main" id="ok" type="button">Back</button></div></div>`);$('ok').onclick=welcome};
  if(saved)$('wRes').onclick=()=>{S=saved;deck=F.createDeck(D,S.deck);closeVeil();resume()};
}
function countScreen(){
  banner('How many explorers?');
  openVeil(`<div class="box"><h2>How many players?</h2><p>Everyone plays on this screen and passes it around.</p><div class="counts">${[1,2,3,4].map(n=>`<button class="cnt" type="button" data-n="${n}"><b>${n}</b><span>${n===1?'player':'players'}</span></button>`).join('')}</div><div class="row"><button class="btn" id="cBack" type="button">Back</button></div></div>`);
  $('cBack').onclick=welcome;
  $('sheet').querySelectorAll('.cnt').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.n,ps=[];
    for(let k=0;k<n;k++){const l=LAST[k]||{};ps.push({name:l.name||SEAT_DEFAULT[k],animal:l.animal!=null?l.animal:DEFAULT_ANIMAL[k],color:l.color!=null?l.color:DEFAULT_COLOR[k]})}
    playerScreen(ps,0);
  });
}
function playerScreen(ps,k){
  const n=ps.length,me=ps[k],before=ps.slice(0,k);
  if(before.some(q=>q.animal===me.animal))me.animal=ANIMALS.findIndex((_,a)=>!before.some(q=>q.animal===a));
  if(before.some(q=>q.color===me.color))me.color=COLORS.findIndex((_,c)=>!before.some(q=>q.color===c));
  banner(`Player ${k+1}: pick your explorer`);
  openVeil(`<div class="box setup"><p class="step">Player ${k+1} of ${n}</p><div class="who"><div class="prev" id="prev"></div><label class="nmw">Name<input type="text" id="pName" maxlength="14" value="${esc(me.name)}" autocomplete="off"></label></div>
    <h3>Pick your animal</h3><div class="anims">${ANIMALS.map((a,ai)=>{const t=before.some(q=>q.animal===ai);return`<button type="button" class="anc" data-a="${ai}" ${t?'disabled':''} aria-pressed="${me.animal===ai}">${animalSvg(a,'#2B2418','#FBF7EE',40)}<span>${esc(a.name)}</span>${t?'<em>taken</em>':''}</button>`}).join('')}</div>
    <h3>Pick your color</h3><div class="sw">${COLORS.map((c,ci)=>{const t=before.some(q=>q.color===ci);return`<button type="button" class="swb${t?' taken':''}" data-c="${ci}" style="--c:${c.c}" aria-label="${c.n}${t?' (taken)':''}" aria-pressed="${me.color===ci}" ${t?'disabled':''}></button>`}).join('')}</div>
    <div class="row"><button class="btn" id="pBack" type="button">Back</button><button class="btn main" id="pNext" type="button">${k<n-1?'Next player':'Start the game'}</button></div></div>`);
  const paint=()=>{$('prev').innerHTML=pinSvg({animal:me.animal,color:me.color,tokens:[]},'pv',84)+`<span>${esc(ANIMALS[me.animal].name)}</span>`;
    $('sheet').querySelectorAll('.anc').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.a===me.animal));
    $('sheet').querySelectorAll('.swb').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.c===me.color))};
  paint();
  $('sheet').querySelectorAll('.anc').forEach(b=>b.onclick=()=>{me.animal=+b.dataset.a;paint()});
  $('sheet').querySelectorAll('.swb').forEach(b=>b.onclick=()=>{me.color=+b.dataset.c;paint()});
  const keep=()=>{me.name=($('pName').value.trim()||SEAT_DEFAULT[k]).slice(0,14)};
  $('pBack').onclick=()=>{keep();k?playerScreen(ps,k-1):countScreen()};
  $('pNext').onclick=()=>{keep();if(k<n-1)return playerScreen(ps,k+1);
    deck=F.createDeck(D);LAST=ps.map(q=>({...q}));
    S={players:ps.map((q,i)=>({seat:i,name:q.name,animal:q.animal,color:q.color,pos:HUB,tokens:[],compass:0})),turn:0,phase:'roll',roll:null,second:false,card:null,winner:null};
    closeVeil();startTurn();
  };
}
function resume(){
  render();
  if(S.phase==='question'||S.phase==='final')return ask();
  if(S.phase==='after')return next();
  if(S.phase==='pick')return pickFinal();
  if(S.phase==='choose'){const p=cur();dests=reach(p.pos,S.roll,has9(p));showDests();drawDock();return banner(`<b>${esc(p.name)}</b> rolled <b>${S.roll}</b>: tap a glowing square`)}
  startTurn();
}
function rules(){
  const inGame=S&&S.phase!=='setup';
  openVeil(`<div class="box"><h2>How to play</h2>${RULES}<div class="row"><button class="btn main" id="ok" type="button">Got it</button></div></div>`);
  $('ok').onclick=()=>{inGame?closeVeil():welcome()};
}
function menu(){
  if(!S||S.phase==='setup')return;
  const back=$('veil').classList.contains('open')?$('sheet').innerHTML:null;
  if(back)return; /* finish the card first */
  openVeil(`<div class="box"><h2>Menu</h2><label class="tog"><input type="checkbox" id="mSnd" ${SOUND?'checked':''}> Sounds for right and wrong answers</label><p>The game saves itself on this device after every turn.</p><div class="row"><button class="btn main" id="mc" type="button">Back to the game</button><button class="btn" id="mn" type="button">Start a new game</button></div><p id="mq" hidden>Start over? Everyone's tokens will be lost. <button class="btn" id="my" type="button">Yes, new game</button></p></div>`);
  $('mSnd').onchange=()=>{SOUND=$('mSnd').checked;try{localStorage.setItem('wa-sound',SOUND?'on':'off')}catch(e){}};
  $('mc').onclick=closeVeil;
  $('mn').onclick=()=>{$('mq').hidden=false};
  $('my').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}welcome()};
}

/* ---------- events ---------- */
$('die').addEventListener('click',roll);
$('hits').addEventListener('click',e=>{const h=e.target.closest('.hit');if(h)moveTo(+h.dataset.n)});
$('rulesBtn').addEventListener('click',()=>{if(!$('veil').classList.contains('open'))rules()});
$('menuBtn').addEventListener('click',menu);
document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target===document.body&&S&&S.phase==='roll'){e.preventDefault();roll()}});

F.load().then(d=>{D=d;S=null;drawBoard();setup();window.__game={render:()=>render(),get S(){return S},get deck(){return deck},get dests(){return dests},reach,roll,moveTo,N,adj}})
 .catch(()=>banner('The question cards did not load. Try reloading the page.'));
}
</script>
</body>
